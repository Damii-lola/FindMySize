<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5e9d6" />
    <title>FindMySize — Your activation code</title>
    <link rel="stylesheet" href="/src/auth.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <main class="auth-stage">
      <div class="auth-card-wrap">
        <div class="auth-card">
          <header class="auth-head">
            <h1>Payment received</h1>
            <p class="auth-lead">Your one-time activation code is below. Copy it and go back to the main site to log in.</p>
          </header>
          <p class="auth-lead" id="code-display" style="font-size: 1.8rem; font-weight: bold; letter-spacing: 0.1em; text-align: center;">Loading…</p>
          <p class="status" id="status">This code works only once. After you use it, you will not need it again unless you cancel.</p>
          <a class="btn btn--primary btn--block" href="%BASE_URL%auth/">Go to login</a>
        </div>
      </div>
    </main>
    <script type="module">
      const API = (window.location.origin.includes('github.io') ? 'https://findmysize.onrender.com' : window.location.origin) + '/api';
      const params = new URLSearchParams(location.search);
      const email = params.get('email') || params.get('customer_email') || '';
      const display = document.getElementById('code-display');
      const status = document.getElementById('status');
      if (!email) {
        display.textContent = 'No email found';
        status.textContent = 'If you just paid, contact support with your receipt.';
      } else {
        fetch(API + '/pay/code?email=' + encodeURIComponent(email))
          .then(r => r.json())
          .then(data => {
            if (data.code) {
              display.textContent = data.code;
              status.textContent = 'Copy this code. You will enter it on the login page.';
            } else {
              display.textContent = 'Code not ready yet';
              status.textContent = 'Payment may still be processing. Refresh in a minute.';
            }
          })
          .catch(() => {
            display.textContent = 'Error';
            status.textContent = 'Could not fetch code. Try again later.';
          });
      }
    </script>
  </body>
</html>
