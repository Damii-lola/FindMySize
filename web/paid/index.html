<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your code — FindMySize</title>
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="/">FindMy<b>Size</b></a></header>
  <main>
    <h1>Activation code</h1>
    <p class="lead">Use this once, on the login page, with the email code. You will not be asked for it again unless the subscription is canceled.</p>
    <section class="card">
      <label><span>Email you signed up with</span><input id="email" type="email" /></label>
      <p>Code: <strong id="code">waiting for payment…</strong></p>
      <a class="primary" href="/login/">Go to login</a>
    </section>
  </main>
  <script type="module">
    import { api } from '/assets/api.js';
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('email');
    input.value = params.get('email') || sessionStorage.getItem('fms_pay_email') || '';
    async function poll() {
      if (!input.value) return;
      try {
        const res = await api('/api/pay/code?email=' + encodeURIComponent(input.value.trim()));
        document.getElementById('code').textContent = res.code || 'waiting for payment…';
      } catch { /* keep waiting */ }
    }
    input.onchange = poll;
    poll();
    setInterval(poll, 4000);
  </script>
</body>
</html>
