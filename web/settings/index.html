<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — FindMySize</title>
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">FindMy<b>Size</b></a>
    <div class="nav-links">
      <a href="/dashboard/">Dashboard</a>
      <button class="user-btn" id="user-btn" type="button" aria-label="Account">☺</button>
    </div>
    <div class="menu" id="user-menu"></div>
  </header>
  <main>
    <h1>Settings</h1>
    <section class="card">
      <p id="who" class="note">Checking account…</p>
      <button class="ghost" id="cancel" type="button" hidden>Cancel subscription</button>
      <p id="msg" class="note"></p>
    </section>
  </main>
  <script type="module">
    import { api, mountUserMenu, token } from '/assets/api.js';
    mountUserMenu();
    if (!token()) location.href = '/login/';
    const who = document.getElementById('who');
    const cancel = document.getElementById('cancel');
    const me = await api('/api/me');
    who.textContent = me.email
      ? `${me.email} — ${me.unlimited ? 'active until ' + (me.paidUntil || 'this period') : (me.status || 'not active')}`
      : 'Not logged in.';
    if (me.unlimited) cancel.hidden = false;
    cancel.onclick = async () => {
      if (!confirm('Cancel this subscription? The next login will need a new activation code after you pay again.')) return;
      const res = await api('/api/me/subscription/cancel', { method: 'POST', body: {} });
      document.getElementById('msg').textContent = `Status: ${res.status}. Log in again after you pay to enter a new code.`;
      cancel.hidden = true;
    };
  </script>
</body>
</html>
