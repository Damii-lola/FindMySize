<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — FindMySize</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 1rem; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <h2>Log in</h2>

  <div id="step-creds" class="step active">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="continue">Continue</button>
  </div>

  <div id="step-otp" class="step">
    <p>Enter the code from your email</p>
    <input id="otp" placeholder="OTP" maxlength="6" />
    <div id="activation-field" hidden>
      <input id="activation" placeholder="Activation code" />
    </div>
    <button id="finish">Log in</button>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
