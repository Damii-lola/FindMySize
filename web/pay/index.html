<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate — FindMySize</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 1rem; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <h2>Activate account</h2>

  <div id="step-signup" class="step active">
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <input id="confirm" type="password" placeholder="Confirm password" required />
    <button id="send-otp">Send code</button>
  </div>

  <div id="step-otp" class="step">
    <p>Enter the code sent to your email</p>
    <input id="otp" placeholder="6-digit code" maxlength="6" />
    <button id="verify-otp">Verify</button>
  </div>

  <div id="step-activate" class="step">
    <p>Account created. Activate to unlock full features.</p>
    <button id="go-pay">Activate with Selar</button>
  </div>

  <script type="module" src="/src/pay.js"></script>
</body>
</html>
