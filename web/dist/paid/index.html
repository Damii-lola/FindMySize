<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://findmysize.onrender.com https://*.supabase.co; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:;" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#f5e9d6" />
    <title>FindMySize — Your activation code</title>
    <link rel="icon" href="/FindMySize/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/FindMySize/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/FindMySize/apple-touch-icon.png" />
    <script src="/FindMySize/theme-init.js"></script>
    <style>
      .code-box {
        margin: 8px 0 16px;
        padding: 22px 16px;
        background: #221a15;
        color: #f5e9d6;
        border-radius: 16px;
        text-align: center;
      }
      .code-kicker {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #f0521f;
        font-weight: 650;
      }
      .code-value {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: 0.18em;
        font-weight: 600;
      }
      .code-value.is-empty { letter-spacing: 0; font-size: 1.2rem; color: rgba(245, 233, 214, 0.7); }
      .copy-row { display: flex; gap: 10px; margin-bottom: 14px; }
      .copy-row .btn { flex: 1; }
      .hint { margin: 0 0 16px; color: var(--muted, #6b5b4e); font-size: .95rem; line-height: 1.5; text-align: center; }
    </style>
    <script type="module" crossorigin src="/FindMySize/assets/paid-9ljRDYbb.js"></script>
    <link rel="modulepreload" crossorigin href="/FindMySize/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/FindMySize/assets/auth-CAE-0p9E.css">
    <link rel="stylesheet" crossorigin href="/FindMySize/assets/theme-B_KWcFXd.css">
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" href="/FindMySize/" aria-label="FindMySize — home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="9" fill="#f0521f"/>
            <g transform="rotate(45 16 16)">
              <rect x="12.5" y="6" width="7" height="3.2" rx="1" fill="#fdf7ea"/>
              <rect x="12.5" y="9.2" width="7" height="1.4" fill="#f0521f"/>
              <rect x="12.5" y="10.6" width="7" height="12.2" rx="0.6" fill="#fdf7ea"/>
              <path d="M12.5 22.8h7L16 28z" fill="#fdf7ea"/>
              <path d="M14.9 26.3h2.2L16 28z" fill="#191411"/>
            </g>
          </svg>
          <span class="brand-name">FindMy<b>Size</b></span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="/FindMySize/dashboard/">Dashboard</a>
        </nav>
      </div>
    </header>

    <main class="auth-main shell">
      <div class="auth-grid">
        <div class="auth-card-wrap">
          <section class="auth-card">
            <div class="card-bar">
              <span class="card-tag"><span class="dot"></span>Paid</span>
              <span class="card-secure">
                <svg class="od-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7.2 10.2V7.4a4.8 4.8 0 0 1 9.6 0v2.8"/>
                  <rect x="4.9" y="10.2" width="14.2" height="9.3" rx="2.4"/>
                </svg>
                One-time code
              </span>
            </div>

            <div class="card-body">
              <header class="auth-head">
                <h1>Payment received</h1>
                <p class="auth-lead">Copy your activation code, then log in and enter it with the code from your email.</p>
              </header>

              <div class="code-box">
                <p class="code-kicker">Activation code</p>
                <p class="code-value is-empty" id="code-display">Loading…</p>
              </div>

              <div class="copy-row">
                <button class="btn btn--ghost" id="copy-btn" type="button" disabled>Copy code</button>
              </div>

              <p class="hint" id="status">This code works only once. After you use it, you will not need it again unless you cancel.</p>

              <a class="btn btn--primary btn--block" href="/FindMySize/auth/">
                Go to login
                <svg class="od-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
              </a>
            </div>
          </section>
        </div>
      </div>
    </main>

  </body>
</html>
