<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindMySize — Your subscription</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5e9d6; color: #221a15; font-family: system-ui, sans-serif; }
    .card { width: min(440px, calc(100% - 32px)); background: #fffaf3; border: 1px solid rgba(34,26,21,.12); border-radius: 20px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 14px; color: #6b5b4e; }
    input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(34,26,21,.18); font: inherit; margin-bottom: 12px; }
    button { border: 0; border-radius: 999px; background: #f0521f; color: #fff; font: inherit; font-weight: 700; padding: 12px 16px; cursor: pointer; }
    button.ghost { background: #fff; color: #221a15; border: 1px solid rgba(34,26,21,.16); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .status { font-weight: 700; }
    .on { color: #157347; } .off { color: #9a4d12; }
    #sub { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Your subscription</h1>
    <p>Enter the code from your payment.</p>
    <form id="look">
      <input id="code" placeholder="Activation code" autocomplete="off" />
      <button type="submit">View</button>
    </form>
    <div id="sub">
      <p class="status" id="state"></p>
      <p id="renews"></p>
      <p id="auto"></p>
      <div class="row">
        <button class="ghost" id="toggle" type="button">Turn off auto-renewal</button>
        <button id="renew" type="button">Renew</button>
      </div>
    </div>
    <p class="status" id="msg"></p>
  </main>
  <script>
    var API = 'https://findmysize.onrender.com/api/pay';
    var current = '';
    async function load(code) {
      var res = await fetch(API + '/subscription?code=' + encodeURIComponent(code));
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Not found');
      current = code;
      document.getElementById('sub').style.display = 'block';
      var state = document.getElementById('state');
      state.textContent = data.active ? 'Active' : 'Inactive — popups are off';
      state.className = 'status ' + (data.active ? 'on' : 'off');
      document.getElementById('renews').textContent = data.daysLeft + ' day' + (data.daysLeft === 1 ? '' : 's') + ' until the next payment (' + new Date(data.renewsAt).toLocaleDateString() + ').';
      document.getElementById('auto').textContent = data.autoRenew ? 'Auto-renewal is on.' : 'Auto-renewal is off. When the time is up, this code turns off and the popups stop.';
      document.getElementById('toggle').textContent = data.autoRenew ? 'Turn off auto-renewal' : 'Turn on auto-renewal';
      document.getElementById('toggle').dataset.on = data.autoRenew ? '0' : '1';
    }
    document.getElementById('look').addEventListener('submit', async function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      msg.textContent = 'Checking…';
      try { await load(document.getElementById('code').value.trim()); msg.textContent = ''; }
      catch (err) { msg.textContent = err.message; }
    });
    document.getElementById('toggle').addEventListener('click', async function () {
      var on = this.dataset.on === '1';
      await fetch(API + '/subscription/auto-renew', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: current, on: on }) });
      load(current);
    });
    document.getElementById('renew').addEventListener('click', async function () {
      await fetch(API + '/subscription/renew', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: current }) });
      load(current);
    });
  </script>
</body>
</html>
