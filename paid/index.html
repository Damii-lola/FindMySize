<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5e9d6" />
    <title>FindMySize — Your activation code</title>
    <link rel="icon" href="/FindMySize/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/FindMySize/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/FindMySize/apple-touch-icon.png" />
    <script src="/FindMySize/theme-init.js"></script>
    <script type="module" crossorigin src="/FindMySize/assets/paid-7xUYNR0L.js"></script>
    <link rel="modulepreload" crossorigin href="/FindMySize/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/FindMySize/assets/auth-CAE-0p9E.css">
    <link rel="stylesheet" crossorigin href="/FindMySize/assets/theme-B_KWcFXd.css">
  </head>
  <body>
    <main class="auth-stage">
      <div class="auth-card-wrap">
        <div class="auth-card">
          <header class="auth-head">
            <h1>Payment received</h1>
            <p class="auth-lead">Your one-time activation code is below. Copy it and go back to the main site to log in.</p>
          </header>
          <p class="auth-lead" id="code-display" style="font-size: 1.8rem; font-weight: bold; letter-spacing: 0.1em; text-align: center;">Loading…</p>
          <p class="status" id="status">This code works only once. After you use it, you will not need it again unless you cancel.</p>
          <a class="btn btn--primary btn--block" href="/FindMySize/auth/">Go to login</a>
        </div>
      </div>
    </main>
  </body>
</html>
